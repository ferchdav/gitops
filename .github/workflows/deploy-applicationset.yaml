name: Validate and Deploy ApplicationSet

on:

  pull_request:
    branches:
      - main
      - dev
    paths:
      - '*/*/applicationset.yaml'
      - '.github/config/tribe-projects.yaml'
      - '.github/scripts/**'
      - '.github/workflows/deploy-applicationset.yaml'

  push:
    branches:
      - main
      - dev
    paths:
      - '*/*/applicationset.yaml'
      - '.github/config/tribe-projects.yaml'
      - '.github/scripts/**'
      - '.github/workflows/deploy-applicationset.yaml'

  workflow_dispatch:
    inputs:
      tribe:
        description: "Tribe directory"
        required: true
        default: dfa
        type: choice
        options:
          - dfa
          - ige

      target_environment:
        description: "Environment. prd maps to the prod directory."
        required: true
        default: dev
        type: choice
        options:
          - dev
          - uat
          - prd

      clusterName:
        description: "Target Kubernetes cluster"
        required: true
        default: npe
        type: choice
        options:
          - npe
          - uat
          - prd

      kubectlAction:
        description: "Kubectl action to execute"
        required: true
        default: list_appset
        type: choice
        options:
          - apply_appset
          - describe_appset
          - list_appset
          - delete_appset

permissions:
  contents: read


jobs:

  # =========================================================
  # VALIDATE
  #
  # pull_request:
  #   validates changed enabled ApplicationSets
  #
  # push:
  #   validates changed enabled ApplicationSets
  #
  # workflow_dispatch:
  #   validates exactly:
  #
  #   <tribe>/<environment-directory>/applicationset.yaml
  #
  # Includes:
  #
  # - YAML validation
  # - ApplicationSet validation
  # - kubectl apply --dry-run=server
  # =========================================================

  validate:
    name: Validate ApplicationSet

    runs-on: ubuntu-latest

    outputs:
      appset_count: ${{ steps.select.outputs.count }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml yamllint


      - name: Determine commits
        id: commits
        shell: bash
        run: |

          if [ "${{ github.event_name }}" = "pull_request" ]; then

            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          elif [ "${{ github.event_name }}" = "push" ]; then

            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"

          else

            BASE_SHA=""
            HEAD_SHA="${{ github.sha }}"

          fi

          echo "base=${BASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "head=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

          echo "Base SHA: ${BASE_SHA}"
          echo "Head SHA: ${HEAD_SHA}"


      - name: Find candidate ApplicationSets
        shell: bash
        run: |

          set -e

          BASE_SHA="${{ steps.commits.outputs.base }}"
          HEAD_SHA="${{ steps.commits.outputs.head }}"

          touch /tmp/appset-files-all.txt

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            echo "Manual workflow execution."
            echo "Selected tribe:         ${{ inputs.tribe }}"
            echo "Selected environment:   ${{ inputs.target_environment }}"
            echo "Selected cluster:       ${{ inputs.clusterName }}"
            echo "Selected kubectlAction: ${{ inputs.kubectlAction }}"

            find . \
              -mindepth 3 \
              -maxdepth 3 \
              -type f \
              -name applicationset.yaml \
              | sed 's#^\./##' \
              | sort \
              > /tmp/appset-files-all.txt

          elif [ -z "${BASE_SHA}" ] || \
               [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then

            find . \
              -mindepth 3 \
              -maxdepth 3 \
              -type f \
              -name applicationset.yaml \
              | sed 's#^\./##' \
              | sort \
              > /tmp/appset-files-all.txt

          else

            git diff \
              --name-only \
              --diff-filter=ACMR \
              "${BASE_SHA}" \
              "${HEAD_SHA}" \
              -- '*/*/applicationset.yaml' \
              > /tmp/appset-files-all.txt

          fi

          echo
          echo "Candidate ApplicationSets:"
          cat /tmp/appset-files-all.txt || true


      - name: Load previous tribe configuration
        shell: bash
        run: |

          BASE_SHA="${{ steps.commits.outputs.base }}"

          echo "tribes: {}" \
            > /tmp/tribe-projects-base.yaml

          if [ -z "${BASE_SHA}" ]; then
            exit 0
          fi

          if [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            exit 0
          fi

          if git cat-file \
            -e "${BASE_SHA}:.github/config/tribe-projects.yaml" \
            2>/dev/null; then

            git show \
              "${BASE_SHA}:.github/config/tribe-projects.yaml" \
              > /tmp/tribe-projects-base.yaml

          fi


      - name: Select ApplicationSets
        id: select
        shell: bash
        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            python \
              .github/scripts/select_appsets.py \
              --config .github/config/tribe-projects.yaml \
              --changed-files /tmp/appset-files-all.txt \
              --output /tmp/appset-files.txt \
              --target-tribe "${{ inputs.tribe }}" \
              --target-environment "${{ inputs.target_environment }}"

          else

            python \
              .github/scripts/select_appsets.py \
              --config .github/config/tribe-projects.yaml \
              --base-config /tmp/tribe-projects-base.yaml \
              --changed-files /tmp/appset-files-all.txt \
              --output /tmp/appset-files.txt

          fi

          COUNT=$(
            grep -cve '^[[:space:]]*$' \
              /tmp/appset-files.txt \
              2>/dev/null || true
          )

          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

          echo
          echo "Selected ApplicationSets:"
          cat /tmp/appset-files.txt || true


      - name: Upload selected ApplicationSet list
        uses: actions/upload-artifact@v4
        with:
          name: selected-applicationsets
          path: /tmp/appset-files.txt
          if-no-files-found: error


      - name: Validate YAML syntax
        if: steps.select.outputs.count != '0'
        shell: bash
        run: |

          while read -r file; do

            [ -z "$file" ] && continue

            echo
            echo "=========================================="
            echo "yamllint: $file"
            echo "=========================================="

            yamllint \
              -d '{
                extends: default,
                rules: {
                  line-length: disable,
                  document-start: disable,
                  truthy: disable
                }
              }' \
              "$file"

          done < /tmp/appset-files.txt


      - name: Validate ApplicationSets
        if: steps.select.outputs.count != '0'
        run: |

          python \
            .github/scripts/validate_applicationset.py \
            --config .github/config/tribe-projects.yaml \
            --files /tmp/appset-files.txt


      # -----------------------------------------------------
      # Safety check for manual workflow_dispatch:
      #
      # dev -> npe
      # uat -> uat
      # prd -> prd
      #
      # This prevents:
      #
      # environment = dev
      # clusterName  = prd
      # -----------------------------------------------------

      - name: Validate environment and cluster match
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |

          set -e

          case "${{ inputs.target_environment }}" in
            dev)
              EXPECTED_CLUSTER="npe"
              ;;
            uat)
              EXPECTED_CLUSTER="uat"
              ;;
            prd)
              EXPECTED_CLUSTER="prd"
              ;;
            *)
              echo "Invalid environment: ${{ inputs.target_environment }}"
              exit 1
              ;;
          esac

          if [ "${{ inputs.clusterName }}" != "${EXPECTED_CLUSTER}" ]; then

            echo "ERROR: Environment and cluster do not match."
            echo "Selected environment: ${{ inputs.target_environment }}"
            echo "Selected cluster:     ${{ inputs.clusterName }}"
            echo "Expected cluster:     ${EXPECTED_CLUSTER}"

            exit 1

          fi

          echo "Environment/cluster match validated."


      # -----------------------------------------------------
      # Kubernetes server-side dry-run.
      #
      # This is part of validation.
      #
      # pull_request and push:
      #   cluster is inferred from the file path:
      #
      #   dev  -> npe
      #   uat  -> uat
      #   prod -> prd
      #
      # workflow_dispatch:
      #   clusterName input is validated and used.
      # -----------------------------------------------------

      - name: Kubernetes server-side dry-run
        if: steps.select.outputs.count != '0'
        env:
          KUBECONFIG_B64_NPE: ${{ secrets.KUBECONFIG_B64_NPE }}
          KUBECONFIG_B64_UAT: ${{ secrets.KUBECONFIG_B64_UAT }}
          KUBECONFIG_B64_PRD: ${{ secrets.KUBECONFIG_B64_PRD }}
        shell: bash
        run: |

          set -euo pipefail

          configure_cluster() {

            local cluster="$1"
            local kubeconfig_b64=""

            case "${cluster}" in
              npe)
                kubeconfig_b64="${KUBECONFIG_B64_NPE}"
                ;;
              uat)
                kubeconfig_b64="${KUBECONFIG_B64_UAT}"
                ;;
              prd)
                kubeconfig_b64="${KUBECONFIG_B64_PRD}"
                ;;
              *)
                echo "ERROR: Invalid cluster: ${cluster}"
                exit 1
                ;;
            esac

            if [ -z "${kubeconfig_b64}" ]; then
              echo "ERROR: Missing kubeconfig secret for cluster: ${cluster}"
              exit 1
            fi

            mkdir -p ~/.kube

            echo "${kubeconfig_b64}" \
              | base64 --decode \
              > ~/.kube/config

            chmod 600 ~/.kube/config
          }


          cluster_for_environment_directory() {

            local environment_directory="$1"

            case "${environment_directory}" in
              dev)
                echo "npe"
                ;;
              uat)
                echo "uat"
                ;;
              prod|prd)
                echo "prd"
                ;;
              *)
                echo "ERROR"
                ;;
            esac
          }


          while read -r file; do

            [ -z "$file" ] && continue

            tribe_directory="$(echo "$file" | cut -d/ -f1)"
            environment_directory="$(echo "$file" | cut -d/ -f2)"

            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

              cluster="${{ inputs.clusterName }}"

            else

              cluster="$(cluster_for_environment_directory "${environment_directory}")"

              if [ "${cluster}" = "ERROR" ]; then
                echo "ERROR: Cannot infer cluster from path: ${file}"
                echo "Environment directory: ${environment_directory}"
                exit 1
              fi

            fi

            echo
            echo "=========================================="
            echo "Server-side dry-run"
            echo "=========================================="
            echo "File:        ${file}"
            echo "Tribe:       ${tribe_directory}"
            echo "Environment: ${environment_directory}"
            echo "Cluster:     ${cluster}"
            echo "=========================================="

            configure_cluster "${cluster}"

            kubectl cluster-info
            kubectl get crd applicationsets.argoproj.io

            kubectl apply \
              --dry-run=server \
              -f "$file"

          done < /tmp/appset-files.txt


      - name: Nothing to validate
        if: steps.select.outputs.count == '0'
        run: |
          echo "No ApplicationSets from enabled tribes require validation."


  # =========================================================
  # KUBECTL ACTION
  #
  # Runs only for workflow_dispatch.
  #
  # It executes the selected kubectlAction against exactly:
  #
  # <tribe>/<environment-directory>/applicationset.yaml
  #
  # Actions:
  #
  # - apply_appset
  # - describe_appset
  # - list_appset
  # - delete_appset
  # =========================================================

  kubectl-action:
    name: Run kubectl ApplicationSet Action

    runs-on: ubuntu-latest

    needs:
      - validate

    if: |
      needs.validate.outputs.appset_count != '0' &&
      github.event_name == 'workflow_dispatch'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Download selected ApplicationSet list
        uses: actions/download-artifact@v4
        with:
          name: selected-applicationsets
          path: /tmp


      - name: Configure Kubernetes
        env:
          KUBECONFIG_B64_NPE: ${{ secrets.KUBECONFIG_B64_NPE }}
          KUBECONFIG_B64_UAT: ${{ secrets.KUBECONFIG_B64_UAT }}
          KUBECONFIG_B64_PRD: ${{ secrets.KUBECONFIG_B64_PRD }}
        shell: bash
        run: |

          set -euo pipefail

          case "${{ inputs.clusterName }}" in
            npe)
              KUBECONFIG_B64="${KUBECONFIG_B64_NPE}"
              ;;
            uat)
              KUBECONFIG_B64="${KUBECONFIG_B64_UAT}"
              ;;
            prd)
              KUBECONFIG_B64="${KUBECONFIG_B64_PRD}"
              ;;
            *)
              echo "ERROR: Invalid clusterName: ${{ inputs.clusterName }}"
              exit 1
              ;;
          esac

          if [ -z "${KUBECONFIG_B64}" ]; then
            echo "ERROR: Missing kubeconfig secret for cluster: ${{ inputs.clusterName }}"
            exit 1
          fi

          mkdir -p ~/.kube

          echo "${KUBECONFIG_B64}" \
            | base64 --decode \
            > ~/.kube/config

          chmod 600 ~/.kube/config

          kubectl cluster-info

          echo
          echo "Current context:"
          kubectl config current-context


      - name: Run selected kubectl action
        shell: bash
        run: |

          set -euo pipefail

          echo "Selected tribe:         ${{ inputs.tribe }}"
          echo "Selected environment:   ${{ inputs.target_environment }}"
          echo "Selected cluster:       ${{ inputs.clusterName }}"
          echo "Selected kubectlAction: ${{ inputs.kubectlAction }}"

          while read -r file; do

            [ -z "$file" ] && continue

            echo
            echo "=========================================="
            echo "Target ApplicationSet"
            echo "=========================================="
            echo "File: ${file}"
            echo "=========================================="

            case "${{ inputs.kubectlAction }}" in

              apply_appset)

                echo "Running: kubectl apply -f ${file}"

                kubectl apply \
                  -f "$file"

                ;;

              describe_appset)

                echo "Running: kubectl describe -f ${file}"

                kubectl describe \
                  -f "$file"

                ;;

              list_appset)

                echo "Running: kubectl get -f ${file} -o wide"

                kubectl get \
                  -f "$file" \
                  -o wide

                ;;

              delete_appset)

                echo "Running: kubectl delete -f ${file}"

                kubectl delete \
                  -f "$file"

                ;;

              *)

                echo "ERROR: Invalid kubectlAction: ${{ inputs.kubectlAction }}"
                exit 1

                ;;

            esac

          done < /tmp/appset-files.txt